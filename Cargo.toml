[workspace]
resolver = "2"
members = [
    "crates/qap-format-core",
    "crates/qap-compiler-engine",
    "crates/qapc-cli",
]

[workspace.package]
version = "0.0.41"
edition = "2021"
authors = ["Timothy Charles Holborn <timothy.holborn@gmail.com>"]
license = "CC-BY-NC-ND-4.0"
repository = "https://github.com/WebCivics/qap-compiler"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qap-format-core = { path = "crates/qap-format-core" }
qap-compiler-engine = { path = "crates/qap-compiler-engine" }

# Canonical Webizen Debian native Cargo profiles (PLAN-WEBIZEN-DEBIAN-NATIVE-PROFILES-2026-11-26).
[profile.webizen-host]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-desktop]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-subsystem]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-mobile]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
incremental = false

[profile.webizen-iot-headless]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

[profile.webizen-iot-display]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
incremental = false

